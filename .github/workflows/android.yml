name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.1.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: carpoolr-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 9

      - name: Publish latest APKs to apk-latest branch
        run: |
          mkdir /tmp/apk && cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk /tmp/apk/
          cd /tmp/apk
          git init -q -b apk-latest
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "APK from ${GITHUB_SHA::7}" --allow-empty
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q --amend -m "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-latest
